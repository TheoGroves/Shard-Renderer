
name: ShardRenderer CI

on:
  push:
    branches: [experimental]
  pull_request:
    branches: [experimental]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vulkan
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          install_lavapipe: true

      - name: Setup dependencies
        run: .\setup_dependencies.bat

      - name: Configure CMake
        run: cmake -S . -B build/Renderer

      - name: Build Renderer
        run: cmake --build build/Renderer --config Release
      
      - name: Run Tests
        run: ctest --test-dir build/Renderer -C Release --output-on-failure

      - name: Upload Renderer
        uses: actions/upload-artifact@v4
        with:
          name: ShardRenderer-Windows-Release
          path: build/Renderer/Release/ShardRenderer.exe
          if-no-files-found: error
